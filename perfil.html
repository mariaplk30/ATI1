<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="icon" type="image/x-icon" href="http://www.ciens.ucv.ve/portalasig2/favicon.ico">
    <link rel="stylesheet" href="./css/style.css">    
    <script src="./js/index.js"></script>
</head>
<body class="perfil">
    <div class="contenedor">
        <div class="contenedor-foto">
            <picture>
                <source media="(min-width: 1025px)" srcset="" id="img-lg">
                <source media="(max-width: 1024px)" srcset="" id="img-sm">
                <img src="" alt="Foto del estudiante" id="foto-perfil">
            </picture>
        </div>
        <div class="info-contenedor">
            <div class="nombre" id="nombre-perfil"></div>
            <p class="bio" id="bio-perfil">

            </p>

            <div class="preferencias">
                <div id="lbl-color"></div><div id="pref-color"></div>
                <div id="lbl-libro"></div><div id="pref-libro"></div>
                <div id="lbl-musica"></div><div id="pref-musica"></div>
                <div id="lbl-videojuego"></div><div id="pref-videojuego"></div>
                <div id="lbl-lenguajes"><b></b></div><div id="pref-lenguajes"><b></b></div>
            </div>
            
            <div class="contacto" id="contacto-texto">
            </div>
        </div>
    </div>
</body>
</html>
